<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Travel With Dreams — small-group trips across India and abroad. Ladakh, Spiti, Kashmir, Kerala, Goa, Bali and more, with expert trip captains and transparent pricing."
    />
    <meta name="theme-color" content="#0a4f7d" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X). __SITE_URL__ is filled in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Travel With Dreams" />
    <meta property="og:title" content="Travel With Dreams — Trips that become stories" />
    <meta
      property="og:description"
      content="Small-group trips across India and beyond, with expert trip captains, real stays and pricing you can see line by line."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Travel With Dreams: mountains above the clouds at sunrise" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Travel With Dreams — Trips that become stories" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Home only: fetch the hero photo early. Keep the URL in sync with HERO_IMAGE in src/components/Hero.jsx. -->
    <script>
      if (location.pathname === '/') {
        var hero = document.createElement('link');
        var base = 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4';
        hero.rel = 'preload';
        hero.as = 'image';
        hero.imageSrcset = [400, 800, 1200, 1600]
          .map(function (w) { return base + '?auto=format&fit=crop&w=' + w + '&q=75 ' + w + 'w'; })
          .join(', ');
        hero.imageSizes = '100vw';
        hero.fetchPriority = 'high';
        document.head.appendChild(hero);
      }
    </script>
    <title>Travel With Dreams — Trips that become stories</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
