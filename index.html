<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="__SITE_DESCRIPTION__" />
    <meta name="theme-color" content="__THEME_COLOR__" />

    <!-- Everything in __DOUBLE_UNDERSCORES__ is filled from src/config/site.js by vite.config.js. -->
    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X). __SITE_URL__ is filled in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:title" content="__SITE_NAME__ — __SITE_TAGLINE__" />
    <meta property="og:description" content="__SITE_DESCRIPTION__" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="__SITE_NAME__: mountains above the clouds at sunrise" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SITE_NAME__ — __SITE_TAGLINE__" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- The site-wide background photo (`hero.image` in src/config/site.js); the same address is set as --backdrop. -->
    <link rel="preload" as="image" href="__BACKDROP_URL__" fetchpriority="high" />
    <title>__SITE_NAME__ — __SITE_TAGLINE__</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
